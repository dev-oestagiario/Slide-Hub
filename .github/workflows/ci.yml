name: CI SlideHub
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
      - run: npm run skills:check
  e2e:
    # Playwright 1.56 supports Ubuntu 24.04; runner default Ubuntu 26 is not supported.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test:e2e
      - name: Evidências E2E em falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-f5
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  security-sql:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: slidehub_ci_only
          POSTGRES_DB: slidehub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d slidehub_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Test migrations and authorization in disposable PostgreSQL
        env:
          PGPASSWORD: slidehub_ci_only
        run: psql -h 127.0.0.1 -U postgres -d slidehub_ci -v ON_ERROR_STOP=1 -f tests/sql/bootstrap.sql
